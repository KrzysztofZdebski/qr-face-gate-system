services:
  db:
    image: postgres:15-alpine
    container_name: qr-face-gate-db
    environment:
      POSTGRES_USER: qrfaceuser
      POSTGRES_PASSWORD: qrfacepass
      POSTGRES_DB: qrfacegate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrfaceuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qr-face-gate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qr-face-gate-system
    ports:
      - "5000:5000"
    volumes:
      # Persist uploads if needed
      - ./backend/uploads:/uploads:rw
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - POSTGRES_USER=qrfaceuser
      - POSTGRES_PASSWORD=qrfacepass
      - POSTGRES_DB=qrfacegate
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:

