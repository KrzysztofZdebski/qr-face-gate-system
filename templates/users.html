<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - QR Face Gate System</title>
    <link rel="stylesheet" href="/static/css/users.css">
</head>
<body>
    <div class="container">
        <h1>👥 All Users</h1>
        
        <div class="actions">
            <a href="/admin/dashboard" class="btn btn-secondary">← Back to Dashboard</a>
            <a href="/add_user" class="btn btn-primary">➕ Add New User</a>
        </div>
        
        {% if users %}
        <table class="users-table">
            <thead>
                <tr>
                    <th>QR Code</th>
                    <th>Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td class="qr-cell">
                        <img src="{{ url_for('base.get_qr_code', user_id=user.id) }}" alt="QR Code" class="qr-code">
                    </td>
                    <td class="name-cell">{{ user.name }}</td>
                    <td class="actions-cell">
                        <button onclick="printQR({{ user.id }}, '{{ user.name }}')" class="btn btn-info btn-sm">🖨️ Print QR</button>
                        <form method="POST" action="{{ url_for('base.delete_user', user_id=user.id) }}" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this user?')">
                            <button type="submit" class="btn btn-danger btn-sm">🗑️ Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="no-users">
            <p>No users found. <a href="/add_user">Add the first user</a>.</p>
        </div>
        {% endif %}
    </div>
    
    <script>
        function printQR(userId, userName) {
            const qrUrl = `/qr_code/${userId}`;
            
            // Open a new window for printing
            const printWindow = window.open('', '_blank', 'width=400,height=400');
            
            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>QR Code - ${userName}</title>
                    <style>
                        body { 
                            font-family: Arial, sans-serif; 
                            text-align: center; 
                            padding: 20px;
                        }
                        .qr-container {
                            border: 2px solid #000;
                            padding: 20px;
                            display: inline-block;
                            background: white;
                        }
                        .qr-code {
                            width: 200px;
                            height: 200px;
                        }
                        .user-name {
                            font-size: 18px;
                            font-weight: bold;
                            margin: 10px 0;
                        }
                    </style>
                </head>
                <body>
                    <div class="qr-container">
                        <div class="user-name">${userName}</div>
                        <img src="${qrUrl}" alt="QR Code" class="qr-code">
                    </div>
                </body>
                </html>
            `);
            
            printWindow.document.close();
            printWindow.focus();
            
            // Wait for image to load then print
            printWindow.onload = function() {
                printWindow.print();
                printWindow.close();
            };
        }
    </script>
</body>
</html>
