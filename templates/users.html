<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - QR Face Gate System</title>
    <link rel="stylesheet" href="/static/css/users.css">
    
</head>
<body>
    <div class="container">
        <h1>👥 All Users</h1>
        <a href="/" class="btn btn-secondary">← Back to Home</a>
        
        {% if users %}
        <table class="users-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>QR Code</th>
                    <th>Created At</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.id }}</td>
                    <td>{{ user.name }}</td>
                    <td class="qr-code-cell">
                        <img src="/qr_code/{{ user.id }}" alt="QR Code for {{ user.name }}">
                    </td>
                    <td>{{ user.created_at.strftime('%Y-%m-%d %H:%M:%S') }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="empty-state">
            <h3>No users found</h3>
            <p>Add your first user to get started!</p>
            <a href="/add_user" class="btn btn-secondary" style="margin-top: 20px;">Add User</a>
        </div>
        {% endif %}
    </div>
</body>
</html>
