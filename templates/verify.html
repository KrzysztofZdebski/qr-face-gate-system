<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Access - QR Face Gate System</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            width: 100%;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            margin-top: 10px;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .preview {
            margin-top: 20px;
            text-align: center;
        }
        
        .preview img {
            max-width: 300px;
            border-radius: 10px;
            margin-top: 10px;
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .result h3 {
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        
        .error {
            color: #dc3545;
            margin-top: 10px;
            padding: 10px;
            background: #f8d7da;
            border-radius: 5px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #004085;
        }
        
        .info h3 {
            margin-bottom: 10px;
        }
        
        .qr-scanner {
            margin-top: 15px;
            text-align: center;
        }
        
        #qr-reader {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .scan-button {
            padding: 10px 20px;
            font-size: 0.9em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            background: #28a745;
            color: white;
            margin-top: 10px;
        }
        
        .scan-button:hover {
            background: #218838;
        }
        
        .scan-button.stop {
            background: #dc3545;
        }
        
        .scan-button.stop:hover {
            background: #c82333;
        }
        
        .camera-preview {
            margin-top: 15px;
            border: 2px solid #667eea;
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Verify Access</h1>
        
        <div class="info">
            <h3>How to verify:</h3>
            <ol style="text-align: left; margin-left: 20px;">
                <li>Scan or enter the QR code data (User ID)</li>
                <li>Capture or upload a photo of the person's face</li>
                <li>Click "Verify" to check if the face matches the QR code owner</li>
            </ol>
        </div>
        
        <form id="verifyForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="qr_code_data">QR Code Data (User ID):</label>
                <input type="text" id="qr_code_data" name="qr_code_data" placeholder="Enter User ID from QR code or scan QR code" required>
                <button type="button" class="scan-button" id="scanQRBtn">📷 Scan QR Code</button>
                <div class="qr-scanner" id="qrScanner" style="display: none;">
                    <div id="qr-reader"></div>
                    <button type="button" class="scan-button stop" id="stopScanBtn" style="display: none;">Stop Scanning</button>
                </div>
            </div>
            
            <div class="form-group">
                <label for="face_image">Face Image (JPG/PNG):</label>
                <input type="file" id="face_image" name="face_image" accept="image/*" required>
                <button type="button" class="scan-button" id="captureFaceBtn" style="margin-top: 10px;">📷 Capture Face from Camera</button>
                <div class="camera-preview" id="cameraPreview" style="display: none;">
                    <video id="faceVideo" autoplay playsinline style="width: 100%; max-width: 500px; display: block; margin: 0 auto;"></video>
                    <canvas id="faceCanvas" style="display: none;"></canvas>
                    <button type="button" class="scan-button" id="captureBtn" style="margin: 10px;">Capture Photo</button>
                    <button type="button" class="scan-button stop" id="stopCameraBtn" style="margin: 10px;">Stop Camera</button>
                </div>
                <div class="preview" id="preview"></div>
            </div>
            
            <div class="error" id="error"></div>
            
            <button type="submit" class="btn btn-primary">Verify Access</button>
            <a href="/" class="btn btn-secondary">Back to Home</a>
        </form>
        
        <div class="result" id="result">
            <h3 id="resultTitle"></h3>
            <p id="resultMessage"></p>
        </div>
    </div>
    
    <script>
        const faceImageInput = document.getElementById('face_image');
        const preview = document.getElementById('preview');
        let html5QrCode = null;
        let faceStream = null;
        
        // QR Code Scanner
        const scanQRBtn = document.getElementById('scanQRBtn');
        const stopScanBtn = document.getElementById('stopScanBtn');
        const qrScanner = document.getElementById('qrScanner');
        const qrCodeInput = document.getElementById('qr_code_data');
        
        scanQRBtn.addEventListener('click', function() {
            if (html5QrCode) {
                // Already scanning, stop it
                stopQRScanning();
            } else {
                startQRScanning();
            }
        });
        
        stopScanBtn.addEventListener('click', function() {
            stopQRScanning();
        });
        
        function startQRScanning() {
            html5QrCode = new Html5Qrcode("qr-reader");
            qrScanner.style.display = 'block';
            scanQRBtn.style.display = 'none';
            stopScanBtn.style.display = 'inline-block';
            
            html5QrCode.start(
                { facingMode: "environment" },
                {
                    fps: 10,
                    qrbox: { width: 250, height: 250 }
                },
                (decodedText, decodedResult) => {
                    // QR code scanned successfully
                    qrCodeInput.value = decodedText;
                    stopQRScanning();
                },
                (errorMessage) => {
                    // Ignore errors, keep scanning
                }
            ).catch((err) => {
                console.error("Unable to start scanning", err);
                alert("Unable to access camera. Please check permissions.");
                stopQRScanning();
            });
        }
        
        function stopQRScanning() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    html5QrCode = null;
                    qrScanner.style.display = 'none';
                    scanQRBtn.style.display = 'inline-block';
                    stopScanBtn.style.display = 'none';
                }).catch((err) => {
                    console.error("Error stopping scanner", err);
                });
            }
        }
        
        // Face Camera Capture
        const captureFaceBtn = document.getElementById('captureFaceBtn');
        const cameraPreview = document.getElementById('cameraPreview');
        const faceVideo = document.getElementById('faceVideo');
        const faceCanvas = document.getElementById('faceCanvas');
        const captureBtn = document.getElementById('captureBtn');
        const stopCameraBtn = document.getElementById('stopCameraBtn');
        
        captureFaceBtn.addEventListener('click', function() {
            startFaceCamera();
        });
        
        stopCameraBtn.addEventListener('click', function() {
            stopFaceCamera();
        });
        
        captureBtn.addEventListener('click', function() {
            captureFacePhoto();
        });
        
        function startFaceCamera() {
            navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: "user",
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                } 
            })
            .then(function(stream) {
                faceStream = stream;
                faceVideo.srcObject = stream;
                cameraPreview.style.display = 'block';
                captureFaceBtn.style.display = 'none';
            })
            .catch(function(err) {
                console.error("Error accessing camera", err);
                alert("Unable to access camera. Please check permissions.");
            });
        }
        
        function stopFaceCamera() {
            if (faceStream) {
                faceStream.getTracks().forEach(track => track.stop());
                faceStream = null;
                faceVideo.srcObject = null;
                cameraPreview.style.display = 'none';
                captureFaceBtn.style.display = 'inline-block';
            }
        }
        
        function captureFacePhoto() {
            const context = faceCanvas.getContext('2d');
            faceCanvas.width = faceVideo.videoWidth;
            faceCanvas.height = faceVideo.videoHeight;
            context.drawImage(faceVideo, 0, 0);
            
            faceCanvas.toBlob(function(blob) {
                const file = new File([blob], "captured-face.jpg", { type: "image/jpeg" });
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);
                faceImageInput.files = dataTransfer.files;
                
                // Trigger preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = '<h4>Preview:</h4><img src="' + e.target.result + '" alt="Preview">';
                };
                reader.readAsDataURL(file);
                
                stopFaceCamera();
            }, "image/jpeg", 0.95);
        }
        
        faceImageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = '<h4>Preview:</h4><img src="' + e.target.result + '" alt="Preview">';
                };
                reader.readAsDataURL(file);
            }
        });
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            stopQRScanning();
            stopFaceCamera();
        });
        
        document.getElementById('verifyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('qr_code_data', document.getElementById('qr_code_data').value);
            formData.append('face_image', faceImageInput.files[0]);
            
            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');
            const resultTitle = document.getElementById('resultTitle');
            const resultMessage = document.getElementById('resultMessage');
            
            errorDiv.classList.remove('show');
            resultDiv.classList.remove('show', 'success', 'error');
            
            try {
                const response = await fetch('/verify', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    if (data.match) {
                        resultDiv.classList.add('show', 'success');
                        resultTitle.textContent = '✅ Access Granted!';
                        resultMessage.innerHTML = `
                            <strong>User:</strong> ${data.user_name}<br>
                            <strong>User ID:</strong> ${data.user_id}<br>
                            <strong>Face Distance:</strong> ${data.face_distance.toFixed(4)}<br>
                            <strong>Match Threshold:</strong> ${data.threshold}
                        `;
                    } else {
                        resultDiv.classList.add('show', 'error');
                        resultTitle.textContent = '❌ Access Denied!';
                        resultMessage.innerHTML = `
                            <strong>Face does not match the QR code owner.</strong><br>
                            <strong>Expected User:</strong> ${data.user_name}<br>
                            <strong>Face Distance:</strong> ${data.face_distance.toFixed(4)}<br>
                            <strong>Threshold:</strong> ${data.threshold} (lower is better match)
                        `;
                    }
                } else {
                    errorDiv.textContent = data.error || 'An error occurred';
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                errorDiv.textContent = 'Network error: ' + error.message;
                errorDiv.classList.add('show');
            }
        });
    </script>
</body>
</html>
