<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User - QR Face Gate System</title>
    <link rel="stylesheet" href="/static/css/add_user.css">
    <script src="/static/js/add_user.js"></script>
</head>
<body>
    <div class="container">
        <h1>➕ Add New User</h1>

        
        <form id="addUserForm" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="face_image">Face Image (JPG/PNG):</label>
                <input type="file" id="face_image" name="face_image" accept="image/*" required>
                <div class="preview" id="preview"></div>
            </div>
            
            <div class="error" id="error"></div>
            <div class="success" id="success"></div>
            <div class="btn-container">
                <button type="submit" class="btn btn-primary">Generate QR Code</button>
                <a href="/" class="btn btn-secondary">Back to Home</a>
            </div>
        </form>
        
        <div class="qr-result" id="qrResult">
            <h3>✅ User Added Successfully!</h3>
            <p><strong>Name:</strong> <span id="userName"></span></p>
            <p><strong>User ID:</strong> <span id="userId"></span></p>
            <h4>Your QR Code:</h4>
            <img id="qrImage" src="" alt="QR Code">
            <p style="margin-top: 15px; color: #666;">Save this QR code for access verification</p>
        </div>
        <div class="bottom-actions">
            <a href="/" class="btn btn-secondary btn-inline">← Back to Home</a>
        </div>
    </div>
    
   
</body>
</html>
