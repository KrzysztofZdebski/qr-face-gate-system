<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User - QR Face Gate System</title>
    <link rel="stylesheet" href="/static/css/add_user.css">
</head>
<body>
    <div class="container">
        <h1>➕ Add New User</h1>

        
        <form id="addUserForm" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="face_image">Face Image (JPG/PNG):</label>
                <input type="file" id="face_image" name="face_image" accept="image/*" required>
                <div class="preview" id="preview"></div>
            </div>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="{% if category == 'error' %}error{% else %}success{% endif %} show">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <div class="btn-container">
                <button type="submit" class="btn btn-primary">Add User</button>
                <a href="{{ url_for('base.list_users') }}" class="btn btn-secondary">Back to Users</a>
            </div>
        </form>
        <div class="bottom-actions">
            <a href="/admin/dashboard" class="btn btn-secondary btn-inline">← Back to Admin Dashboard</a>
        </div>
    </div>
    
    <script src="/static/js/add_user.js"></script>
</body>
</html>
