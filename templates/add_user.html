<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User - QR Face Gate System</title>
    <link rel="stylesheet" href="/static/css/add_user.css">
    <script src="/static/js/add_user.js"></script>
</head>
<body>
    <div class="container">
        <h1>➕ Add New User</h1>

        
        <form id="addUserForm" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="face_image">Face Image (JPG/PNG):</label>
                <input type="file" id="face_image" name="face_image" accept="image/*" required>
                <div class="preview" id="preview"></div>
            </div>
            
            <div class="error" id="error"></div>
            <div class="success" id="success"></div>
            <div class="btn-container">
                <button type="submit" class="btn btn-primary">Generate QR Code</button>
                <a href="/" class="btn btn-secondary">Back to Home</a>
            </div>
        </form>
        
        <div class="qr-result" id="qrResult">
            <h3>✅ User Added Successfully!</h3>
            <p><strong>Name:</strong> <span id="userName"></span></p>
            <p><strong>User ID:</strong> <span id="userId"></span></p>
            <h4>Your QR Code:</h4>
            <img id="qrImage" src="" alt="QR Code">
            <p style="margin-top: 15px; color: #666;">Save this QR code for access verification</p>
            <button onclick="printQRCode()" class="btn btn-secondary" style="margin-top: 15px;">🖨️ Print QR Code</button>
        </div>
        <div class="bottom-actions">
            <a href="/admin/dashboard" class="btn btn-secondary btn-inline">← Back to Admin Dashboard</a>
        </div>
    </div>
    
    <script>
        const faceImageInput = document.getElementById('face_image');
        const preview = document.getElementById('preview');
        
        faceImageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = '<h4>Preview:</h4><img src="' + e.target.result + '" alt="Preview">';
                };
                reader.readAsDataURL(file);
            }
        });
        
        document.getElementById('addUserForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('name', document.getElementById('name').value);
            formData.append('face_image', faceImageInput.files[0]);
            
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');
            const qrResult = document.getElementById('qrResult');
            
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');
            qrResult.classList.remove('show');
            
            try {
                const response = await fetch('/add_user', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('userName').textContent = data.name;
                    document.getElementById('userId').textContent = data.user_id;
                    document.getElementById('qrImage').src = data.qr_code;
                    qrResult.classList.add('show');
                    document.getElementById('addUserForm').reset();
                    preview.innerHTML = '';
                } else {
                    errorDiv.textContent = data.error || 'An error occurred';
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                errorDiv.textContent = 'Network error: ' + error.message;
                errorDiv.classList.add('show');
            }
        });
        
        function printQRCode() {
            const qrImage = document.getElementById('qrImage');
            const userName = document.getElementById('userName').textContent;
            const userId = document.getElementById('userId').textContent;
            
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                <head>
                    <title>QR Code - ${userName}</title>
                    <style>
                        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
                        .qr-container { margin: 20px auto; }
                        .qr-container img { max-width: 300px; }
                        .info { margin-top: 20px; }
                    </style>
                </head>
                <body>
                    <h1>QR Code for Access</h1>
                    <div class="qr-container">
                        <img src="${qrImage.src}" alt="QR Code">
                    </div>
                    <div class="info">
                        <p><strong>Name:</strong> ${userName}</p>
                        <p><strong>User ID:</strong> ${userId}</p>
                    </div>
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.print();
        }
    </script>
</body>
</html>
