<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User - QR Face Gate System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            width: 100%;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            margin-top: 10px;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .preview {
            margin-top: 20px;
            text-align: center;
        }
        
        .preview img {
            max-width: 300px;
            border-radius: 10px;
            margin-top: 10px;
        }
        
        .qr-result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        
        .qr-result.show {
            display: block;
        }
        
        .qr-result img {
            max-width: 300px;
            margin: 20px 0;
        }
        
        .error {
            color: #dc3545;
            margin-top: 10px;
            padding: 10px;
            background: #f8d7da;
            border-radius: 5px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .success {
            color: #28a745;
            margin-top: 10px;
            padding: 10px;
            background: #d4edda;
            border-radius: 5px;
            display: none;
        }
        
        .success.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>➕ Add New User</h1>
        
        <form id="addUserForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="face_image">Face Image (JPG/PNG):</label>
                <input type="file" id="face_image" name="face_image" accept="image/*" required>
                <div class="preview" id="preview"></div>
            </div>
            
            <div class="error" id="error"></div>
            <div class="success" id="success"></div>
            
            <button type="submit" class="btn btn-primary">Generate QR Code</button>
            <a href="/" class="btn btn-secondary">Back to Home</a>
        </form>
        
        <div class="qr-result" id="qrResult">
            <h3>✅ User Added Successfully!</h3>
            <p><strong>Name:</strong> <span id="userName"></span></p>
            <p><strong>User ID:</strong> <span id="userId"></span></p>
            <h4>Your QR Code:</h4>
            <img id="qrImage" src="" alt="QR Code">
            <p style="margin-top: 15px; color: #666;">Save this QR code for access verification</p>
        </div>
    </div>
    
    <script>
        const faceImageInput = document.getElementById('face_image');
        const preview = document.getElementById('preview');
        
        faceImageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = '<h4>Preview:</h4><img src="' + e.target.result + '" alt="Preview">';
                };
                reader.readAsDataURL(file);
            }
        });
        
        document.getElementById('addUserForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('name', document.getElementById('name').value);
            formData.append('face_image', faceImageInput.files[0]);
            
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');
            const qrResult = document.getElementById('qrResult');
            
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');
            qrResult.classList.remove('show');
            
            try {
                const response = await fetch('/add_user', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('userName').textContent = data.name;
                    document.getElementById('userId').textContent = data.user_id;
                    document.getElementById('qrImage').src = data.qr_code;
                    qrResult.classList.add('show');
                    document.getElementById('addUserForm').reset();
                    preview.innerHTML = '';
                } else {
                    errorDiv.textContent = data.error || 'An error occurred';
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                errorDiv.textContent = 'Network error: ' + error.message;
                errorDiv.classList.add('show');
            }
        });
    </script>
</body>
</html>
